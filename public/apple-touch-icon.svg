<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Blue Gradient Background -->
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    
    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Shape (Rounded Square) -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#appGradient)" filter="url(#dropShadow)" />

  <!-- Subtle Medical Cross (Top Right Accent) -->
  <g fill="#FFFFFF" opacity="0.8" transform="translate(360, 90)">
    <rect x="16" y="0" width="12" height="44" rx="4" />
    <rect x="0" y="16" width="44" height="12" rx="4" />
  </g>

  <!-- Main "9N" Text -->
  <text x="256" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="160" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">
    9N
  </text>

  <!-- "St. V Hospital" Text -->
  <text x="256" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="34" fill="#E0E7FF" text-anchor="middle" letter-spacing="1.5">
    St. V Hospital
  </text>

  <!-- Subtitle -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#93C5FD" text-anchor="middle" letter-spacing="3" opacity="0.9">
    ROSTER HUB
  </text>
</svg>
